<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT-Deck Studio</title>
  <link rel="stylesheet" href="/css/base.css">
  <style>
    /* Desktop-only admin page, not part of the phone PWA -- kept as one
       self-contained file rather than a shared stylesheet since nothing
       else uses these rules. */
    body {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    header a {
      color: #8e5ff5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #2a2f38;
      font-size: 14px;
    }

    th {
      color: #9aa3b2;
      font-weight: 600;
    }

    button {
      background: #1A1F26;
      color: #F1F5F9;
      border: 1px solid #2a2f38;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #2a2f38;
    }

    button.danger:hover {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* Same flex row idiom as #item-form .form-actions -- two bare adjacent
       buttons otherwise sit almost flush against each other. */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* The table's Edit/Delete cell, set by renderTable in studio.js. Same
       display:flex + 8px gap as .toolbar and #item-form .form-actions, and
       deliberately nothing else -- Delete sitting flush against Edit is
       exactly the hazard the .toolbar comment above describes, and it's
       worse here because one of the pair is destructive. (No align-items:
       a blockified <td> doesn't stretch its flex line, so the buttons keep
       their natural 29px height even on a wrapped, 74px-tall row.) */
    .row-actions {
      display: flex;
      gap: 8px;
    }

    /* #item-form select doesn't reach the toolbar's own workspace picker, and
       an unstyled select renders as an OS-default light control on this dark
       page. Same field colors as the form's inputs, but the button's padding
       and font-size so it sits level with the two buttons in the flex row. */
    .toolbar select {
      background: #0B0D10;
      color: #F1F5F9;
      border: 1px solid #2a2f38;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
    }

    /* Four columns, not two: an ordinary field spans 2 of them (exactly the
       half width it had before), and the quarter-width sets -- the four colour
       pickers, and Row/Col/Width/Height -- take a single column each. Doing it
       this way keeps every field a direct child of this one grid, so the
       grouping needs no wrapper divs and the `grid-column: 1 / -1` rules below
       (and both #item-form label selectors) keep resolving against it. */
    #item-form {
      background: #1A1F26;
      border: 1px solid #2a2f38;
      border-radius: 10px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* #item-form's own ID selector otherwise beats the UA [hidden]
       stylesheet rule on specificity, so form.hidden = true had no visual
       effect and the form stayed rendered (with stale/blank field values)
       across Cancel/Save and even before the first Edit click. */
    #item-form[hidden] {
      display: none;
    }

    /* Exactly the same specificity trap as #item-form[hidden] above, one
       level down: #item-form label's display:flex outranks the UA [hidden]
       rule, so the audio_switch device pickers would stay visible for every
       other Type without this. #devices-message needs no such rule (like
       #params-error, no ID selector sets its display). */
    #item-form label[hidden] {
      display: none;
    }

    #devices-message {
      grid-column: 1 / -1;
      font-size: 13px;
      color: #9aa3b2;
    }

    #devices-message.error {
      color: #dc2626;
    }

    #item-form label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: #9aa3b2;
      /* Half the form, as before -- see the four-column comment above. */
      grid-column: span 2;
    }

    /* Group heading. The whole hierarchy signal is this being #F1F5F9 against
       the fields' own #9aa3b2 labels, plus the hairline and the spacing --
       deliberately no card, background or border-radius per group, and no
       ALL-CAPS. The spacing is asymmetric on purpose: 24px of margin plus the
       rule and 12px of padding above the heading, only the grid's 12px below
       it, so each heading reads as belonging to the fields under it. Identity
       has no heading (it's the form's first content), so every h2 here --
       including the first -- separates two groups and keeps the same 24px. */
    #item-form .form-group {
      grid-column: 1 / -1;
      margin: 24px 0 0;
      padding-top: 12px;
      border-top: 1px solid #2a2f38;
      font-size: 13px;
      font-weight: 600;
      color: #F1F5F9;
    }

    /* Label and Params (JSON). Set on the <label>, never on the control inside
       it: the label is the grid item, and #item-form label's display:flex makes
       the input/textarea a flex child, where grid-column does nothing at all. */
    #item-form .field-full {
      grid-column: 1 / -1;
    }

    /* Label identifies the item, so it's the largest control in the form. Needs
       the #item-form prefix to outrank #item-form input's own font-size below --
       a bare #field-label would lose that on specificity and silently do
       nothing, the same trap as #item-form label[hidden] above. */
    #item-form #field-label {
      font-size: 16px;
      padding: 10px;
    }

    /* The four colour pickers, and Row/Col/Width/Height: one column each, so
       each set lands as a single four-across row instead of four half-width
       cells carrying the same visual weight as Label. */
    #item-form .field-quarter {
      grid-column: span 1;
    }

    /* On Row only, so the geometry quartet starts a fresh line rather than
       filling the two columns left over by the half-width Workspace field above
       it. Must stay after .field-quarter: same specificity, and this is what
       overrides the grid-column-start that shorthand's `span 1` sets. */
    #item-form .starts-row {
      grid-column-start: 1;
    }

    #item-form input,
    #item-form select,
    #item-form textarea {
      background: #0B0D10;
      color: #F1F5F9;
      border: 1px solid #2a2f38;
      border-radius: 6px;
      padding: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    #item-form input[type="color"] {
      padding: 2px;
      height: 36px;
    }

    /* The `grid-column: 1 / -1` that used to sit here never applied: the grid
       item is this textarea's parent <label>, which carries .field-full now. */
    #field-params {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 80px;
      resize: vertical;
    }

    #params-error {
      grid-column: 1 / -1;
      color: #dc2626;
      font-size: 13px;
    }

    #item-form .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>IT-Deck Studio</h1>
    <a href="/index.html">&larr; Dashboard</a>
  </header>

  <div class="toolbar">
    <button id="new-item-btn" type="button">+ New Item</button>
    <button id="compact-btn" type="button">Compact layout</button>
    <!-- Compact's own target, deliberately outside #item-form: reading the
         form's workspace field meant Compact silently hit whatever that
         hidden dropdown happened to hold, which is only correct for the
         workspace whose item was edited most recently. -->
    <select id="compact-workspace-select"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Label</th>
        <th>Type</th>
        <th>Target</th>
        <th>Position</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="items-tbody"></tbody>
  </table>

  <!-- Grouped identity / action / placement / appearance / advanced. The
       order is the grouping: every field is still a direct child of the one
       grid (see #item-form's four-column comment), and the <h2>s are grid
       children too, so nothing here wraps or nests a field. -->
  <form id="item-form" hidden>
    <input type="hidden" id="field-id">

    <!-- Identity. No heading: it's the form's first content. -->
    <label class="field-full">Label
      <input id="field-label" required>
    </label>

    <label>Icon
      <input id="field-icon" placeholder="e.g. lightbulb">
    </label>

    <h2 class="form-group">Action</h2>

    <label>Kind
      <select id="field-kind">
        <option value="action">action</option>
        <option value="widget">widget</option>
      </select>
    </label>

    <label>Type
      <input id="field-type" required placeholder="e.g. audio_mute_toggle">
    </label>

    <label>Target
      <select id="field-target">
        <option value="windows">windows</option>
        <option value="backend">backend</option>
        <option value="RINA-PC">RINA-PC</option>
      </select>
    </label>

    <label>State key
      <input id="field-state-key" placeholder="optional, e.g. mic.muted">
    </label>

    <!-- audio_switch only: studio.js shows/hides these (and the message
         below) as Type/Target change, and fills them from the selected
         Target agent's live device list. Hidden by default so a fresh form
         for any other Type never flashes them. Kept in the Action group,
         next to the Type and Target fields that drive them. -->
    <label id="primary-device-label" hidden>Primary device
      <select id="field-primary-device"></select>
    </label>

    <label id="secondary-device-label" hidden>Secondary device
      <select id="field-secondary-device"></select>
    </label>

    <div id="devices-message" hidden></div>

    <h2 class="form-group">Placement</h2>

    <label>Workspace
      <select id="field-workspace-id"></select>
    </label>

    <label class="field-quarter starts-row">Row
      <input type="number" id="field-row" required>
    </label>

    <label class="field-quarter">Col
      <input type="number" id="field-col" required>
    </label>

    <label class="field-quarter">Width
      <input type="number" id="field-width" value="1" min="1">
    </label>

    <label class="field-quarter">Height
      <input type="number" id="field-height" value="1" min="1">
    </label>

    <h2 class="form-group">Appearance</h2>

    <label class="field-quarter">Color
      <input type="color" id="field-color" value="#2a2f38">
    </label>

    <label class="field-quarter">Active color
      <input type="color" id="field-active-color" value="#0d9488">
    </label>

    <label class="field-quarter">Alert color
      <input type="color" id="field-alert-color" value="#dc2626">
    </label>

    <label class="field-quarter">Off color
      <input type="color" id="field-false-color" value="#2a2f38">
    </label>

    <h2 class="form-group">Advanced</h2>

    <label class="field-full">Params (JSON)
      <textarea id="field-params">{}</textarea>
    </label>
    <!-- Directly above the actions on purpose: studio.js writes both the
         JSON-validation message and the "Save failed (...)" message here, and
         the second of those has to land next to the button that just failed. -->
    <div id="params-error" hidden></div>

    <div class="form-actions">
      <button type="submit" id="save-btn">Save</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </div>
  </form>

  <script type="module" src="/js/studio.js"></script>
</body>
</html>
