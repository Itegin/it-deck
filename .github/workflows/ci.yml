name: Tests

# Every push to main and every pull request: the backend API, the agent's
# pure checks and the frontend's pure logic. Windows, because the agent's
# modules import pywin32/pycaw at the top and only install there -- the same
# reason release.yml builds on windows-latest.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 and not newer: comtypes, which the agent imports, does not
      # support 3.13/3.14 (see agents/windows/requirements.txt).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -r agents/windows/requirements.txt

      - name: Python tests
        run: python -m pytest tests -q

      - name: Every frontend module parses
        shell: pwsh
        run: |
          Get-ChildItem frontend/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax error in $($_.FullName)" }
          }

      - name: Frontend tests
        run: node --test tests/frontend.test.mjs
