name: Tests

# Every push to main and every pull request, two jobs:
#
# - lint-and-test (Linux): ruff, the full pytest suite and the frontend
#   checks. Fast feedback; every test module imports without Windows (the
#   agent's Windows-only imports live in agent.py and inside functions).
# - test (Windows): the same suite against the real pinned agent
#   dependencies (pywin32, pycaw, comtypes), the environment the exe ships.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The backend's pins plus the two agent libraries its pure tests
      # import, at agents/windows/requirements.txt's versions (keep in step);
      # pywin32/pycaw don't install on Linux and aren't needed here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt Pillow==12.3.0 psutil==7.2.2

      - name: Lint
        run: ruff check .

      - name: Python tests
        run: python -m pytest -q

      - name: Every frontend module parses
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Frontend tests
        run: node --test tests/frontend.test.mjs

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 and not newer: comtypes, which the agent imports, does not
      # support 3.13/3.14 (see agents/windows/requirements.txt).
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt -r agents/windows/requirements.txt

      - name: Python tests
        run: python -m pytest tests -q

      - name: Every frontend module parses
        shell: pwsh
        run: |
          Get-ChildItem frontend/js -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax error in $($_.FullName)" }
          }

      - name: Frontend tests
        run: node --test tests/frontend.test.mjs
