name: Build (tag) / push (manual) backend image

# A pushed version tag only BUILDS the image, as a check that it still
# builds; nothing is published, so a milestone tag never moves :latest under
# anyone who pulls it. Running this workflow by hand, with an existing tag,
# builds and PUSHES it to GHCR -- the same manual step as release.yml.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and push (e.g. v0.5.6)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # The tag this run is about: the pushed one, or the one asked for.
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is ./backend — the Dockerfile COPYs requirements.txt
      # and app/ relative to it, and frontend/ is bind-mounted at run time,
      # never baked into the image.
      - name: Build (and push, when run by hand)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/itegin/it-deck-backend:${{ env.TAG }}
            ghcr.io/itegin/it-deck-backend:latest
