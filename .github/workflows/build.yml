name: Build and push backend image

# Manual releases, not continuous deploy: this runs only on a pushed
# version tag, never on commits to main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is ./backend — the Dockerfile COPYs requirements.txt
      # and app/ relative to it, and frontend/ is bind-mounted at run time,
      # never baked into the image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/itegin/it-deck-backend:${{ github.ref_name }}
            ghcr.io/itegin/it-deck-backend:latest
