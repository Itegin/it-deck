name: Build ITDeck.exe and publish release

# The thing this exists to fix: v0.3.0 and v0.3.1 were tagged with no
# downloadable exe attached, so "install IT-Deck" meant "clone the repo and
# build it yourself on every PC you want to control". standalone/build.ps1 is
# a Windows-only PyInstaller build, so it needs a windows runner -- the
# existing build.yml (GHCR backend image) is ubuntu and cannot do this.
on:
  push:
    tags:
      - "v*.*.*"
  # Also runnable by hand, so a tag that was already pushed without an exe
  # (v0.3.0, v0.3.1) can be given one without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the exe to"
        required: true

permissions:
  contents: write # required to create a release and upload assets

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch the ref is the branch, so check out the tag
          # the run was asked for instead.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 3.12 and not newer, deliberately: comtypes (the Windows COM audio
      # layer the agent depends on) does not support 3.13/3.14 -- see
      # agents/windows/requirements.txt, which says so and why.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r standalone/requirements.txt

      # build.ps1 is not reused here on purpose: it exists to make a developer
      # machine buildable (finding or winget-installing a Python, creating a
      # venv), and every one of those steps is wrong on a runner that already
      # has a pinned interpreter. The PyInstaller invocation below must stay
      # in step with the one in build.ps1.
      - name: Generate the icon
        run: python agents/windows/tools/make_icon.py

      # Absolute paths throughout, and that is not cosmetic: PyInstaller
      # resolves a relative --add-data SOURCE against --specpath, not against
      # the working directory. With --specpath standalone, relative sources
      # sent it looking for standalone/frontend and the build died with
      # "Unable to find ... frontend" -- which is exactly how the first run of
      # this workflow failed. build.ps1 has always passed absolute paths
      # (Join-Path $repoRoot ...), which is why it never hit this.
      - name: Build ITDeck.exe
        run: |
          $ws = "${{ github.workspace }}"
          pyinstaller --onefile --name ITDeck --windowed `
            --paths "$ws\backend" `
            --paths "$ws\agents\windows" `
            --add-data "$ws\frontend;frontend" `
            --add-data "$ws\agents\windows\tools\SoundVolumeView.exe;tools" `
            --add-data "$ws\agents\windows\icon.ico;." `
            --icon "$ws\agents\windows\icon.ico" `
            --distpath "$ws\standalone\dist" `
            --workpath "$ws\standalone\build" `
            --specpath "$ws\standalone" `
            "$ws\standalone\launcher.py"

      - name: Check the exe was produced
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/standalone/dist/ITDeck.exe"
          if (-not (Test-Path $exe)) { throw "ITDeck.exe was not built" }
          $size = (Get-Item $exe).Length
          Write-Host "Built ITDeck.exe ($([math]::Round($size / 1MB, 1)) MB)"
          # A onefile build that somehow produced a stub would still "exist";
          # the real thing is ~26 MB, so anything tiny is a failed build.
          if ($size -lt 10MB) { throw "ITDeck.exe is implausibly small ($size bytes)" }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Keeps hand-written release notes if the release already exists,
          # and generates them from commits if it doesn't.
          generate_release_notes: true
          files: standalone/dist/ITDeck.exe
          body: |
            Download **ITDeck.exe** below and run it — the PC that runs it
            needs nothing installed, not even Python.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/CHANGELOG.md)
            for what changed, and the
            [README](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag || github.ref_name }}/README.md)
            for setup.
