# Provisions a fresh Debian 12 server to run IT-Deck, matching the steps
# done manually in Stage 1: base packages, Docker (via get.docker.com,
# not apt's docker.io -- Debian 12's docker.io package is an older
# Docker release that doesn't ship the compose v2 plugin, and this
# project's own scripts (deploy.sh, backup.sh, docker-compose.yml) all
# assume `docker compose` v2 syntax), firewall, an Nginx reverse proxy
# with a self-signed LAN cert, the app checkout, the daily backup cron
# job, and a loopback-only Prometheus + node_exporter monitoring stack.
#
# No roles/ directory: this playbook provisions exactly one kind of
# host for exactly one project. Roles earn their keep when tasks get
# reused across multiple roles or host groups -- neither applies here,
# and splitting ~15 tasks into role directories (tasks/main.yml,
# defaults/main.yml, meta/main.yml, ...) would add indirection without
# simplifying anything. Revisit if a second, differently-configured
# host group shows up.
#
# Run with:
#   ansible-galaxy collection install -r ansible/requirements.yml
#   ansible-playbook -i ansible/inventory.yml ansible/site.yml
- name: Provision IT-Deck server
  hosts: itdeck_servers
  vars:
    # Change if you fork the repo or deploy from elsewhere. HTTPS, not
    # SSH: the repo is public, so this clones anonymously with zero
    # key/host-key setup -- avoids the "Host key verification failed"
    # failure a blank VM hits on its first-ever connection to
    # github.com over SSH.
    itdeck_repo_url: "https://github.com/Itegin/it-deck.git"
    itdeck_repo_version: main
    itdeck_repo_dest: "{{ ansible_env.HOME }}/it-deck"
    # Must match SERVER_PORT in .env / docker-compose.yml's port
    # mapping -- kept as a separate var (not read back out of .env)
    # because .env doesn't exist yet the first time this firewall rule
    # runs. Update this and re-run if you change SERVER_PORT.
    itdeck_app_port: 8000

    # Prefix put in front of github.com release-download URLs because
    # release-assets.githubusercontent.com is unreachable from this
    # network (TCP connect never completes -- packets silently dropped).
    # Community GitHub-release proxies like this one go down or change
    # over time; if it stops working, blank this to "" to go straight to
    # GitHub again, or swap in another proxy.
    github_release_proxy: "https://gh-proxy.com/"

    # Pinned, never "latest": a floating version means two runs of the same
    # playbook can install different binaries. Bump these by hand. The
    # matching sha256sums.txt from each release is fed to get_url's
    # checksum:, so the pin validates itself and there is no hardcoded hash
    # here to go stale alongside the version.
    itdeck_node_exporter_version: "1.12.1"
    itdeck_prometheus_version: "3.14.0"
    # Both listen on loopback only -- see the monitoring section at the
    # bottom of tasks: for why no firewall rule accompanies them.
    itdeck_node_exporter_listen: "127.0.0.1:9100"
    itdeck_prometheus_listen: "127.0.0.1:9090"
    itdeck_prometheus_retention: "15d"

  tasks:
    # deb.debian.org timed out on every apt-get update during Stage 12
    # testing on this network -- switching to the Yandex mirror by hand was
    # what unblocked it, so do it before anything else touches apt. Runs
    # first in the play deliberately: the base-packages task below is the
    # first apt consumer and would hang without this. Idempotent -- after
    # the first pass there are no deb.debian.org matches left to replace.
    - name: Replace default Debian mirrors with Yandex mirror
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: 'deb\.debian\.org'
        replace: 'mirror.yandex.ru'
      become: true

    - name: Update apt cache and install base packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - sqlite3
          - ufw
          - nginx
          - openssl
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: itdeck_docker_check
      changed_when: false
      failed_when: false

    - name: Download the official Docker install script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"
      when: itdeck_docker_check.rc != 0

    # get.docker.com installs docker-ce, docker-ce-cli, containerd.io,
    # and the docker-compose-plugin (v2) -- exactly what apt's docker.io
    # doesn't give you on Debian 12.
    - name: Run the Docker install script
      ansible.builtin.command: sh /tmp/get-docker.sh
      when: itdeck_docker_check.rc != 0
      become: true

    - name: Ensure the Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      become: true

    - name: Add {{ ansible_user }} to the docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      become: true
      when: ansible_user is defined

    # Group membership doesn't apply to an already-open SSH connection --
    # without this, the "docker compose up" task below would fail with a
    # permission-denied error on a freshly provisioned host even though
    # the group add above reported success.
    - name: Reset the connection so the new docker group membership applies
      ansible.builtin.meta: reset_connection

    - name: Allow SSH through the firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
      become: true

    - name: Allow the app port through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ itdeck_app_port }}"
        proto: tcp
      become: true

    # Port 8000 above stays open on purpose: direct access is the fallback
    # while the proxy is being verified. Closing it is a separate cleanup
    # step once Nginx is confirmed working.
    - name: Allow HTTP through the firewall for the HTTPS redirect
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
      become: true

    - name: Allow HTTPS through the firewall
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
      become: true

    - name: Deny all other inbound traffic by default
      community.general.ufw:
        direction: incoming
        policy: deny
      become: true

    - name: Enable the firewall
      community.general.ufw:
        state: enabled
      become: true

    # Nginx terminates TLS for the LAN and proxies everything to the
    # backend container on 127.0.0.1. Set up before the app is cloned and
    # started so the proxy is already in place the first time the app is
    # reachable through it.
    - name: Create the Nginx TLS directory
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    # creates: makes this a no-op on every re-run -- regenerating the cert
    # would change the fingerprint the phone has already been told to
    # trust. Delete the .crt by hand to force a new one.
    - name: Generate the self-signed TLS certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 3650 -newkey rsa:2048
        -keyout /etc/nginx/ssl/itdeck.key
        -out /etc/nginx/ssl/itdeck.crt
        -subj "/CN=itdeck.local"
      args:
        creates: /etc/nginx/ssl/itdeck.crt
      become: true

    - name: Restrict permissions on the TLS private key
      ansible.builtin.file:
        path: /etc/nginx/ssl/itdeck.key
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Install the IT-Deck Nginx site config
      ansible.builtin.template:
        src: templates/itdeck.conf.j2
        dest: /etc/nginx/sites-available/itdeck
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx
      become: true

    - name: Enable the IT-Deck Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/itdeck
        dest: /etc/nginx/sites-enabled/itdeck
        state: link
      notify: Restart nginx
      become: true

    # Debian's packaged default site also listens on 80 as the default
    # server -- leaving it enabled would let it answer requests ahead of
    # the redirect above.
    - name: Remove the default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx
      become: true

    # The handler only fires when something above actually changed, so this
    # is what asserts nginx is up on an otherwise no-op re-run.
    - name: Ensure the Nginx service is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      become: true

    # Deliberately not the template module's validate: -- nginx -t -c on a
    # bare site fragment fails, because the fragment has no http {} wrapper
    # around it. This checks the assembled config instead.
    - name: Verify the assembled Nginx config parses
      ansible.builtin.command: nginx -t
      changed_when: false
      become: true

    # Handlers otherwise run at the very end of the play -- after the app
    # is already up. Flush here so the proxy is actually live before the
    # app it fronts starts, and so a failure further down can't leave
    # nginx serving the previous config.
    - name: Apply any pending Nginx restart now
      ansible.builtin.meta: flush_handlers

    - name: Clone the IT-Deck repo
      ansible.builtin.git:
        repo: "{{ itdeck_repo_url }}"
        dest: "{{ itdeck_repo_dest }}"
        version: "{{ itdeck_repo_version }}"

    # force: false == "only copy if dest doesn't already exist" -- an
    # existing .env on a re-run is real config (AGENT_TOKEN etc.) and
    # must never be clobbered.
    - name: Copy .env.example to .env if it doesn't already exist
      ansible.builtin.copy:
        src: "{{ itdeck_repo_dest }}/.env.example"
        dest: "{{ itdeck_repo_dest }}/.env"
        remote_src: true
        force: false

    - name: Build and start the backend container
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ itdeck_repo_dest }}"
      register: compose_up
      changed_when: >
        'Started' in (compose_up.stdout + compose_up.stderr)
        or 'Created' in (compose_up.stdout + compose_up.stderr)
        or 'Recreat' in (compose_up.stdout + compose_up.stderr)

    # Matches the crontab line already documented as a comment at the
    # bottom of backup.sh.
    - name: Register the daily backup cron job
      ansible.builtin.cron:
        name: "IT-Deck daily backup"
        user: root
        minute: "0"
        hour: "3"
        job: "{{ itdeck_repo_dest }}/backup.sh >> {{ itdeck_repo_dest }}/data/backups/backup.log 2>&1"

    # Monitoring: Prometheus scraping node_exporter, both installed from the
    # projects' own pinned binary releases rather than apt (Debian 12 ships
    # years-old versions of both).
    #
    # No Grafana, deliberately: this host has a 4GB RAM ceiling, and the
    # only consumer is a human looking at a graph now and then -- which
    # Prometheus's own expression browser on 9090 already covers.
    #
    # No firewall rule, equally deliberately: 9090 and 9100 are NOT opened
    # in ufw, and both processes bind 127.0.0.1 only. Unlike the app, these
    # are not something to put on the LAN -- node_exporter publishes a
    # detailed inventory of the host, and Prometheus's browser is
    # unauthenticated. Reach 9090 with an SSH tunnel instead:
    #     ssh -L 9090:127.0.0.1:9090 <user>@<server>
    - name: Create the node_exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      become: true

    # rc != 0 here just means "not installed yet" -- the download below is
    # gated on the version string, which covers both that and a version
    # bump, so the exit code itself is not interesting.
    - name: Check the installed node_exporter version
      ansible.builtin.command: /usr/local/bin/node_exporter --version
      register: itdeck_node_exporter_check
      changed_when: false
      failed_when: false

    # --version output goes to stdout on some releases and stderr on others,
    # so match against both concatenated (the same idiom the compose task
    # above uses). The trailing space in "version 1.12.1 " is load-bearing:
    # it stops a future 1.12.11 from satisfying a 1.12.1 pin.
    - name: Decide whether node_exporter needs installing
      ansible.builtin.set_fact:
        itdeck_node_exporter_install: >-
          {{ ('version ' ~ itdeck_node_exporter_version ~ ' ') not in
             ((itdeck_node_exporter_check.stdout | default('')) +
              (itdeck_node_exporter_check.stderr | default(''))) }}

    # checksum: is handed the release's own sha256sums.txt and picks the
    # line matching the downloaded filename -- so a truncated or tampered
    # download fails here, instead of becoming a service that won't start.
    - name: Download the node_exporter release tarball
      ansible.builtin.get_url:
        url: "{{ github_release_proxy }}https://github.com/prometheus/node_exporter/releases/download/v{{ itdeck_node_exporter_version }}/node_exporter-{{ itdeck_node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ itdeck_node_exporter_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ github_release_proxy }}https://github.com/prometheus/node_exporter/releases/download/v{{ itdeck_node_exporter_version }}/sha256sums.txt"
        mode: "0644"
        timeout: 60
      when: itdeck_node_exporter_install | bool
      register: itdeck_node_exporter_download_result
      until: itdeck_node_exporter_download_result is succeeded
      retries: 3
      delay: 10

    - name: Unpack the node_exporter release tarball
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter-{{ itdeck_node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
      when: itdeck_node_exporter_install | bool

    - name: Install the node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ itdeck_node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: itdeck_node_exporter_install | bool
      notify: Restart node_exporter
      become: true

    - name: Install the node_exporter systemd unit
      ansible.builtin.template:
        src: templates/node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart node_exporter
      become: true

    # ansible.builtin.systemd rather than the ansible.builtin.service used
    # for docker/nginx above: only the systemd module can daemon_reload,
    # which a freshly written unit file needs before it can be started.
    - name: Ensure the node_exporter service is running and enabled
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true
      become: true

    - name: Create the prometheus system user
      ansible.builtin.user:
        name: prometheus
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      become: true

    - name: Check the installed Prometheus version
      ansible.builtin.command: /usr/local/bin/prometheus --version
      register: itdeck_prometheus_check
      changed_when: false
      failed_when: false

    - name: Decide whether Prometheus needs installing
      ansible.builtin.set_fact:
        itdeck_prometheus_install: >-
          {{ ('version ' ~ itdeck_prometheus_version ~ ' ') not in
             ((itdeck_prometheus_check.stdout | default('')) +
              (itdeck_prometheus_check.stderr | default(''))) }}

    - name: Download the Prometheus release tarball
      ansible.builtin.get_url:
        url: "{{ github_release_proxy }}https://github.com/prometheus/prometheus/releases/download/v{{ itdeck_prometheus_version }}/prometheus-{{ itdeck_prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ itdeck_prometheus_version }}.linux-amd64.tar.gz"
        checksum: "sha256:{{ github_release_proxy }}https://github.com/prometheus/prometheus/releases/download/v{{ itdeck_prometheus_version }}/sha256sums.txt"
        mode: "0644"
        timeout: 60
      when: itdeck_prometheus_install | bool
      register: itdeck_prometheus_download_result
      until: itdeck_prometheus_download_result is succeeded
      retries: 3
      delay: 10

    - name: Unpack the Prometheus release tarball
      ansible.builtin.unarchive:
        src: "/tmp/prometheus-{{ itdeck_prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
      when: itdeck_prometheus_install | bool

    # promtool comes along because the config template below is validated
    # with it. The only other thing in the tarball is a sample
    # prometheus.yml, which the template below replaces outright.
    - name: Install the Prometheus binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ itdeck_prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - prometheus
        - promtool
      when: itdeck_prometheus_install | bool
      notify: Restart prometheus
      become: true

    - name: Create the Prometheus config directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        owner: root
        group: prometheus
        mode: "0750"
      become: true

    # Owned by prometheus, not root: the TSDB is the one thing the service
    # writes, and it cannot open the database at all if this directory is
    # root-owned.
    - name: Create the Prometheus data directory
      ansible.builtin.file:
        path: /var/lib/prometheus
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0750"
      become: true

    # validate: catches a broken config before it is ever written -- which
    # is what the Nginx tasks above wanted and could not have, since
    # nginx -t cannot check a bare site fragment. promtool has no such
    # limitation, so the stronger form is used here. Ordering is
    # load-bearing: promtool is installed above, and the service that reads
    # this file starts below.
    - name: Install the Prometheus config
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: prometheus
        mode: "0640"
        validate: /usr/local/bin/promtool check config %s
      notify: Restart prometheus
      become: true

    - name: Install the Prometheus systemd unit
      ansible.builtin.template:
        src: templates/prometheus.service.j2
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus
      become: true

    - name: Ensure the Prometheus service is running and enabled
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: true
        daemon_reload: true
      become: true

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      become: true

    # daemon_reload here too: these fire on a changed unit file at least as
    # often as on a changed binary or config.
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
      become: true

    - name: Restart prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
        daemon_reload: true
      become: true
